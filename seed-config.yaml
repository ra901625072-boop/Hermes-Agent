# =============================================================================
# Hermes Agent — Seed Configuration
# Copied to /opt/data/config.yaml on boot
# =============================================================================

# --- Timezone for cron scheduling ---
timezone: Asia/Kolkata

# --- Model configuration (Groq primary, Gemini fallback) ---
model:
  default: openai/gpt-oss-120b
  provider: groq

providers:
  groq:
    name: groq
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
    default_model: openai/gpt-oss-120b
    models:
      openai/gpt-oss-120b: {}

fallback_providers:
  - provider: gemini
    model: gemini-3-flash-preview

auxiliary:
  vision:
    provider: gemini
    model: gemini-3-flash-preview

# --- Cron scheduler defaults ---
cron:
  model: openai/gpt-oss-120b
  preflight: false
