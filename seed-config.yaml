# =============================================================================
# Hermes Agent — Seed Configuration
# Copied to /opt/data/config.yaml on boot
# =============================================================================

# --- Timezone for cron scheduling ---
timezone: Asia/Kolkata

# --- Model configuration (Google Gemini) ---
model:
  provider: gemini
  default: gemini-3-flash-preview
  base_url: https://generativelanguage.googleapis.com/v1beta

# --- Fallback Providers ---
fallback_providers:
  - provider: gemini
    model: gemini-3.1-flash-lite

# --- Auxiliary Tasks ---
auxiliary:
  vision:
    provider: gemini
    model: gemini-3-flash-preview

# --- Cron scheduler defaults ---
cron:
  model: gemini-3-flash-preview
  preflight: false
